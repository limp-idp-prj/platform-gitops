apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Сервисы, созданные через платформу
  sourceRepos:
    - https://github.com/limp-idp-prj/platform-gitops
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
